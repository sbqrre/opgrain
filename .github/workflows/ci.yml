name: JSON0 compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moonbit:
    name: MoonBit / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [native, js, wasm, wasm-gc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon fmt --check
      - name: Test core and fixtures
        run: moon test --frozen --deny-warn --target "${{ matrix.target }}"
      - name: Run the task board example
        run: moon run examples/board --target "${{ matrix.target }}" --frozen

      - name: Run persistent snapshot benchmarks
        run: moon run benchmarks/persistent --target "${{ matrix.target }}" --release --frozen

      - name: Run algorithm workload benchmarks
        run: moon run benchmarks/algorithms --target "${{ matrix.target }}" --release --frozen

  oracle:
    name: Node / interoperability and packaging
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test/oracle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: test/oracle/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run fixtures -- --check
      - run: npm run test:reduce
      - name: Install MoonBit for live exchange
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: npm run bridge
      - run: npm run live
      - name: Differential identified-board histories
        run: |
          for seed in 1 20261122 4294967295; do
            EXTENDED_SEED="$seed" npm run extended
          done
      - run: npm run package-smoke
      - name: Differential optimized operation generators
        run: |
          for seed in 1 20261123 4294967295; do
            OPTIMIZED_SEED="$seed" npm run optimized
          done
      - run: node source-size.mjs
